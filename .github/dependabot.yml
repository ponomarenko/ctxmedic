version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    # Minor and patch updates come as one PR; each major update gets its own PR.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the oldest supported Node (engines: >=20).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
