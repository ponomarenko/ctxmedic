name: Action
on:
  push:
    branches: [main]
    paths: [action.yml, action/**, .github/workflows/action.yml]
  pull_request:
    paths: [action.yml, action/**, .github/workflows/action.yml]
permissions:
  contents: read
jobs:
  self:
    name: Passes on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          fail-on: warning

  gate:
    name: Fails on a critical finding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make a project with a broken symlink
        run: mkdir sick && ln -s missing.md sick/CLAUDE.md
      - id: checkup
        uses: ./
        continue-on-error: true
        with:
          path: sick
      - name: Expect the gate to fail
        if: steps.checkup.outcome != 'failure'
        run: echo "::error::the action passed on a critical finding" && exit 1
