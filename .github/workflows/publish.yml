name: Release

on:
  push:
    branches: [main]
  # Re-publish an existing release tag if the automatic publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm, for example v0.2.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {} # release-please acts with the GitHub App token below
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows, so the required CI checks never ran on release PRs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # release-please tags and creates releases
          permission-pull-requests: write # release-please opens the release PR
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release
    if: needs.release.outputs.release_created || inputs.tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11.5+ is needed for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm pack rewrites workspace:* ranges; npm publish does the OIDC exchange.
      - name: Publish to npm
        working-directory: packages/cli
        run: |
          pnpm pack
          npm publish ctxmedic-*.tgz --provenance --access public

  # Move the floating major tag (v0, v1, ...) so `uses: ponomarenko/ctxmedic@v0` gets the latest action.
  major-tag:
    needs: release
    if: needs.release.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the moved major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the major tag
        env:
          MAJOR: v${{ needs.release.outputs.major }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" # checkout fetches no tags
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "$MAJOR"
